<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghostty Terminal</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1e1e1e;
      }

      #terminal {
        width: 100%;
        height: 100%;
        padding: 8px;
      }

      #terminal canvas {
        display: block;
      }

      /* Connection status overlay */
      .status-overlay {
        position: fixed;
        top: 8px;
        right: 8px;
        padding: 4px 8px;
        border-radius: 4px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12px;
        z-index: 1000;
        display: flex;
        align-items: center;
        gap: 6px;
        opacity: 0.8;
        transition: opacity 0.3s;
      }

      .status-overlay:hover {
        opacity: 1;
      }

      .status-overlay.connected {
        background: rgba(39, 201, 63, 0.2);
        color: #27c93f;
      }

      .status-overlay.disconnected {
        background: rgba(255, 95, 86, 0.2);
        color: #ff5f56;
      }

      .status-overlay.connecting {
        background: rgba(255, 189, 46, 0.2);
        color: #ffbd2e;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
      }

      .status-overlay.connecting .status-dot {
        animation: pulse 1s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }
    </style>
  </head>
  <body>
    <div class="status-overlay connecting" id="status">
      <div class="status-dot"></div>
      <span id="status-text">Connecting...</span>
    </div>
    <div id="terminal"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
