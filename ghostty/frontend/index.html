<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghostty Terminal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .terminal-window {
      width: 100%;
      max-width: 1200px;
      height: calc(100vh - 40px);
      max-height: 900px;
      background: #1e1e1e;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .title-bar {
      background: #2d2d2d;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #1a1a1a;
      flex-shrink: 0;
    }

    .traffic-lights {
      display: flex;
      gap: 8px;
    }

    .light {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .light.red { background: #ff5f56; }
    .light.yellow { background: #ffbd2e; }
    .light.green { background: #27c93f; }

    .title {
      color: #e5e5e5;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title img {
      width: 18px;
      height: 18px;
    }

    .connection-status {
      margin-left: auto;
      font-size: 11px;
      color: #888;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #888;
    }

    .status-dot.connected { background: #27c93f; }
    .status-dot.disconnected { background: #ff5f56; }
    .status-dot.connecting { 
      background: #ffbd2e; 
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .terminal-content {
      flex: 1;
      padding: 12px;
      background: #1e1e1e;
      position: relative;
      overflow: hidden;
    }

    .terminal-content canvas {
      display: block;
    }

    @media (max-width: 768px) {
      body {
        padding: 0;
      }

      .terminal-window {
        border-radius: 0;
        height: 100vh;
        max-height: none;
      }
    }
  </style>
</head>
<body>
  <div class="terminal-window">
    <div class="title-bar">
      <div class="traffic-lights">
        <span class="light red"></span>
        <span class="light yellow"></span>
        <span class="light green"></span>
      </div>
      <div class="title">
        <span>Ghostty Terminal</span>
      </div>
      <div class="connection-status">
        <span class="status-dot connecting" id="status-dot"></span>
        <span id="status-text">Connecting...</span>
      </div>
    </div>
    <div class="terminal-content" id="terminal"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
