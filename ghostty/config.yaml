---
name: Ghostty
version: dev
slug: ghostty
description: Browser-based terminal emulator using Ghostty.
url: https://github.com/timmo001/addon-ghostty
init: false
ingress: true
ingress_stream: true
panel_icon: mdi:text-box-outline
homeassistant: 2025.11.0
arch:
  - aarch64
  - amd64
  - armv7
hassio_api: true
hassio_role: manager
homeassistant_api: true
auth_api: true
host_network: true
docker_api: true
journald: true
host_dbus: true
uart: true
usb: true
gpio: true
audio: true
apparmor: false
privileged:
  - NET_ADMIN
  - SYS_ADMIN
  - SYS_RAWIO
  - SYS_TIME
  - SYS_NICE
devices:
  - /dev/mem
ports:
  80/tcp: null
ports_description:
  80/tcp: Web interface (Not required for Ingress)
map:
  - addons:rw
  - all_addon_configs:rw
  - backup:rw
  - homeassistant_config:rw
  - media:rw
  - share:rw
  - ssl:rw
options:
  ssl: true
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  ssl: bool
  certfile: str
  keyfile: str
  leave_front_door_open: bool?
