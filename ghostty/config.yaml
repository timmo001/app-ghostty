---
name: Ghostty
version: dev
slug: ghostty
description: Browser-based terminal emulator using Ghostty.
url: https://github.com/hassio-addons/addon-ghostty
init: false
ingress: true
ingress_stream: true
panel_icon: mdi:text-box-outline
homeassistant: 2025.11.0
arch:
  - aarch64
  - amd64
  - armv7
hassio_api: true
hassio_role: manager
homeassistant_api: true
auth_api: true
ports:
  80/tcp: null
ports_description:
  80/tcp: Web interface (Not required for Ingress)
map:
  - homeassistant_config
  - share
  - ssl
options:
  ssl: true
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  ssl: bool
  certfile: str
  keyfile: str
  leave_front_door_open: bool?
